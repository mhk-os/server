# mhk-os.svit.ac is DNS-only (not proxied by Cloudflare): the game talks to mhk-server directly on 7350 (TLS over
# TCP, UDP for races). nginx only answers the HTTP-01 challenges of the server's Let's Encrypt certificate and sends
# browsers to the project page. The exact server_name beats the *.svit.ac wildcard, which would redirect the
# challenge to https.
server {
    listen 80;
    listen [::]:80;
    server_name mhk-os.svit.ac;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 302 https://github.com/mhk-os/mhk-os;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mhk-os.svit.ac;

    ssl_certificate /etc/letsencrypt/live/mhk-os.svit.ac/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhk-os.svit.ac/privkey.pem;

    return 302 https://github.com/mhk-os/mhk-os;
}
