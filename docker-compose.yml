# Local development: `docker compose up -d db` and run the server with `go run`, or `docker compose up -d` for both.
# MariaDB 10.11 matches the production host.
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: mhk
      MARIADB_USER: mhk
      MARIADB_PASSWORD: mhk
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      MHK_DB_DSN: "mhk:mhk@tcp(db:3306)/mhk?parseTime=true"
      MHK_LISTEN: ":7350"
      MHK_DATA_DIR: /data
    ports:
      - "7350:7350/tcp"
      - "7350:7350/udp"
    volumes:
      - server-data:/data

volumes:
  db-data:
  server-data:
