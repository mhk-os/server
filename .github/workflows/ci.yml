name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mhk
          MYSQL_USER: mhk
          MYSQL_PASSWORD: mhk
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -umhk -pmhk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      MHK_TEST_DSN: mhk:mhk@tcp(127.0.0.1:3306)/mhk?parseTime=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: CGO_ENABLED=0 go build -ldflags "-X main.version=${GITHUB_SHA::12}" ./cmd/mhk-server
